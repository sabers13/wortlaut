# MODULES — canonical machine-readable module map.
#
# Parsed by tools/check_modules.py and tools/affected_tests.py using the
# Python 3.12 stdlib tomllib. Adding/removing a row, an owned_paths entry,
# or a dependency here is a governance-shaped change: the validator runs in
# the authoritative `make gate` and fails closed on any inconsistency.
#
# Schema (per module):
#   id              string  unique module identifier
#   owned_paths     list    glob patterns (forward-slash paths, relative to
#                           repo root). Every tracked file under the
#                           inventory roots (app, tools, frontend/src,
#                           reference) MUST resolve to exactly one module.
#   dependencies    list    module ids this module directly depends on
#                           (imports/uses). Architecture/context metadata
#                           only; the iteration-time resolver
#                           tools/affected_tests.py does NOT automatically
#                           walk reverse dependency closure — it resolves
#                           the directly owning module only (see
#                           docs/agent-efficiency-audit.md Option C).
#   focused_tests   list    pytest-style test paths (forward-slash, relative
#                           to repo root). May be shared across modules.
#   focused_commands list  optional non-pytest focused commands (npm
#                           scripts, frontend typecheck/build, etc.).
#   agents_rules    list    optional AGENTS R-rule identifiers this module
#                           path materially exercises (for review indexing,
#                           not enforcement — see tools/check_agents.py).
#   adrs            list    optional ADR numbers this module implements.

[modules.runtime_api]
owned_paths = [
    "app/api.py",
    "app/__init__.py",
]
dependencies = [
    "audio",
    "deck",
    "dictionary",
    "examples",
