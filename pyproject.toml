[project]
name = "flashcard"
version = "0.1.0"
description = "German flashcard learning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "^\\.venv",
    "^\\.pytest_cache",
    "^\\.mypy_cache",
    "^\\.ruff_cache",
    "^build",
    "^dist",
    "^handoff",
    "^reference",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "handoff",
    "reference",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".venv", "handoff", "build", "dist", "reference"]
