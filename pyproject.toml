[project]
name = "flashcard"
version = "0.1.0"
description = "German flashcard learning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "fsrs==6.3.2",
    "spacy>=3.8.0,<3.9.0",
    "uvicorn==0.52.4",
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "^\\.venv",
    "^\\.pytest_cache",
    "^\\.mypy_cache",
    "^\\.ruff_cache",
    "^build",
    "^dist",
    "^handoff",
    "^reference",
    "^tmp",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "handoff",
    "reference",
    "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_build_dict_stage*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".venv", "handoff", "build", "dist", "reference", "tmp"]
